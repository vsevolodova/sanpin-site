<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1620" />
      <stop offset="100%" stop-color="#172230" />
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0%" stop-color="rgba(34,211,238,0.35)" />
      <stop offset="100%" stop-color="rgba(34,211,238,0)" />
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.9" r="0.5">
      <stop offset="0%" stop-color="rgba(34,211,238,0.18)" />
      <stop offset="100%" stop-color="rgba(34,211,238,0)" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <!-- сетка -->
  <g stroke="rgba(40,52,74,0.45)" stroke-width="1">
    <line x1="0" y1="125" x2="1200" y2="125" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <!-- знак-логотип -->
  <g transform="translate(96, 96)" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="30" />
    <path d="M22 50 V18 L42 50 V18" />
  </g>
  <text x="180" y="135" font-family="Manrope, system-ui, sans-serif" font-size="28" font-weight="700" fill="#F4F6F9">Смарт Спейс Лаб</text>

  <!-- текст -->
  <text x="96" y="320" font-family="Manrope, system-ui, sans-serif" font-size="84" font-weight="800" fill="#F4F6F9">Видеоаналитика</text>
  <text x="96" y="410" font-family="Manrope, system-ui, sans-serif" font-size="84" font-weight="800" fill="#F4F6F9">для соблюдения <tspan fill="#22D3EE">СанПиН</tspan></text>
  <text x="96" y="470" font-family="Manrope, system-ui, sans-serif" font-size="36" font-weight="400" fill="#9AA7B5">комбинат питания · рестораны · производство</text>

  <!-- нижняя плашка -->
  <g transform="translate(96, 530)">
    <rect width="280" height="48" rx="24" fill="rgba(34,211,238,0.14)" stroke="#22D3EE" stroke-width="1.5" />
    <text x="140" y="31" text-anchor="middle" font-family="Manrope, system-ui, sans-serif" font-size="18" font-weight="600" fill="#22D3EE">Обсудить внедрение →</text>
  </g>
</svg>
